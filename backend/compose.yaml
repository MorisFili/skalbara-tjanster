services:

  db:
    image: postgres:18

    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in server.env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in server.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in server.env}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api1:
    build: .

    env_file: server.env

    environment:
      PORT: 3000
      INSTANCE_NAME: api1

      DB_HOST: db
      DB_PORT: 5432

    depends_on:
      db:
        condition: service_healthy


  api2:
    build: .

    env_file: server.env

    environment:
      PORT: 3000
      INSTANCE_NAME: api2

      DB_HOST: db
      DB_PORT: 5432

    depends_on:
      db:
        condition: service_healthy


  api3:
    build: .

    env_file: server.env

    environment:
      PORT: 3000
      INSTANCE_NAME: api3

      DB_HOST: db
      DB_PORT: 5432

    depends_on:
      db:
        condition: service_healthy


  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api1
      - api2
      - api3


volumes:
  postgres_data:
